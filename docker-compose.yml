services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: notebridge
      POSTGRES_USER: notebridge
      POSTGRES_PASSWORD: notebridge
    ports:
      - "5432:5432"
    volumes:
      - notebridge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notebridge -d notebridge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  notebridge-postgres:
